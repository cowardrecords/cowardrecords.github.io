# Sito in locale: docker compose up  →  http://localhost:3000
#
# jekyll: il sito, si aggiorna da solo quando modifichi i file
# media:  converte da solo i file messi in originali/ e li mette in media/
services:
  jekyll:
    image: ruby:2.7
    working_dir: /site
    command:
      - sh
      - -c
      - >-
        gem install bundler:2.2.16 && bundle install &&
        bundle exec jekyll serve --config _config.yml,_config_dev.yml
        --host 0.0.0.0 --port 3000 --force_polling
        --destination /tmp/_site
    ports:
      - "3000:3000"
    volumes:
      - .:/site
      - bundle:/usr/local/bundle

  media:
    build:
      dockerfile_inline: |
        FROM alpine:3.20
        RUN apk add --no-cache ffmpeg imagemagick imagemagick-webp imagemagick-heic imagemagick-jpeg
    working_dir: /site
    command: ["sh", "-c", "while true; do sh scripts/converti.sh; sleep 10; done"]
    volumes:
      - .:/site

volumes:
  bundle:
